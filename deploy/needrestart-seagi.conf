# /etc/needrestart/conf.d/seagi.conf
# Do NOT auto-restart SEAGI services on library upgrades (needrestart).
# seagi-v2 is a long-lived stateful daemon; an auto-restart wipes its volatile
# curriculum/route state (substrate persists on disk, but the ladder progress
# resets and it must re-climb). Restart MANUALLY, at a chosen time.
# Added 2026-07-09 after apt-daily-upgrade restarted it mid-climb (L9 -> re-climb).
$nrconf{override_rc}{qr(^seagi)} = 0;
$nrconf{override_rc}{qr(^replay-watch)} = 0;
# Added 2026-09-26: apt-daily-upgrade restarted the sidecar and orphaned an open scorecard.
$nrconf{override_rc}{qr(^arc3-sidecar)} = 0;
